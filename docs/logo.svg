<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="d8ctl droid">
  <title>d8ctl — Droid-8-c-t-l</title>
  <!-- antenna -->
  <line x1="32" y1="4" x2="32" y2="11" stroke="#b6f06a" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="4" r="3" fill="#b6f06a"/>
  <!-- ears -->
  <rect x="3" y="28" width="5" height="14" rx="2" fill="#6f9a3a"/>
  <rect x="56" y="28" width="5" height="14" rx="2" fill="#6f9a3a"/>
  <!-- head: a terminal screen -->
  <rect x="8" y="11" width="48" height="48" rx="12" fill="#161b20" stroke="#b6f06a" stroke-width="3"/>
  <!-- the 8: one stacked eye -->
  <circle cx="32" cy="25" r="7" fill="#0a0d0b" stroke="#b6f06a" stroke-width="3"/>
  <circle cx="32" cy="40" r="8.5" fill="#0a0d0b" stroke="#b6f06a" stroke-width="3"/>
  <circle cx="34" cy="38.5" r="3.2" fill="#b6f06a"/>
  <circle cx="33.4" cy="23.8" r="2" fill="#d4e8c4"/>
  <!-- mouth: the prompt -->
  <path d="M17 51 l3.5 2.5 -3.5 2.5" fill="none" stroke="#b6f06a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="23" y1="56" x2="28" y2="56" stroke="#b6f06a" stroke-width="2" stroke-linecap="round"/>
</svg>
