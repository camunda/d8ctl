name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: d8ctl-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  # The version this push will release, worked out before anything is built,
  # so every binary reports the version it is released as. A dry run of the
  # same semantic-release config; empty when no release is due.
  version:
    name: Next version
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch remote refs for semantic-release
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - id: next
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -f .next-version
          npx semantic-release --dry-run
          v="$(cat .next-version 2>/dev/null || true)"
          echo "next version: ${v:-none}"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.asset }}
    needs: version
    if: needs.version.outputs.next != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: d8ctl-linux-amd64
          - os: ubuntu-24.04-arm
            asset: d8ctl-linux-arm64
          - os: macos-15
            asset: d8ctl-darwin-arm64
          - os: macos-15-intel
            asset: d8ctl-darwin-amd64
          - os: windows-latest
            asset: d8ctl-windows-amd64.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev zlib1g-dev
      - name: Stamp ${{ needs.version.outputs.next }}
        run: bash scripts/prepare-release.sh "${{ needs.version.outputs.next }}"
      - run: dub test
      - run: dub build -b release
      - name: Stage binary
        run: |
          set -euo pipefail
          mkdir -p release-assets
          bin=d8ctl
          [ "$RUNNER_OS" = Windows ] && bin=d8ctl.exe
          if [ ! -f "$bin" ]; then
            echo "::error::release binary $bin not found"
            exit 1
          fi
          got="$(./"$bin" --version | tr -d '\r')"
          case "$got" in
            "d8ctl ${{ needs.version.outputs.next }} "*) ;;
            *) echo "::error::$bin reports '$got', expected ${{ needs.version.outputs.next }}"; exit 1 ;;
          esac
          cp "$bin" "release-assets/${{ matrix.asset }}"
          chmod +x "release-assets/${{ matrix.asset }}"
          # sha256sum is on every runner (coreutils; Git Bash on Windows); macOS has shasum.
          if command -v sha256sum > /dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          (cd release-assets && $sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Version & GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch remote refs for semantic-release
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          git fetch origin '+refs/notes/*:refs/notes/*' || true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install release tooling
        run: npm install

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -la release-assets

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Publish (semantic-release)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  # npm: @camunda8/d8ctl + one package per platform, from the same binaries.
  # Off until the repo variable NPM_PUBLISH is 'true' (after the first manual
  # publish and npm Trusted Publisher setup; see npm/README.md). Trusted
  # publishing (OIDC): no token. Re-runs skip versions already on npm.
  npm:
    name: Publish to npm
    needs: [version, release]
    if: vars.NPM_PUBLISH == 'true' && needs.version.outputs.next != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: npm >= 11.5 (trusted publishing)
        run: npm install -g npm@latest
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Stage packages
        run: bash scripts/npm-stage.sh "${{ needs.version.outputs.next }}" release-assets npm-out | tee npm-dirs.txt
      - name: Publish (platform packages first)
        run: |
          set -euo pipefail
          while read -r dir; do
            name="$(jq -r .name "$dir/package.json")"
            ver="${{ needs.version.outputs.next }}"
            if npm view "$name@$ver" version > /dev/null 2>&1; then
              echo "$name@$ver already published; skipping"
              continue
            fi
            npm publish "$dir" --provenance --access public
          done < npm-dirs.txt
