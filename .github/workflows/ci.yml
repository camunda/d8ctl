name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: dub test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v5
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev zlib1g-dev zsh fish
      - run: dub run -q --single scripts/generate.d
      - name: Fail if the catalog drifted
        run: git diff --exit-code -- source/d8ctl/generated
      - run: dub test
      - run: dub build -b release
      - run: ./d8ctl --help
      - run: ./d8ctl cluster topology get --help
      - name: Shell completion (bash, zsh, fish) answers a real Tab
        run: ./scripts/test-completion.sh ./d8ctl

  # Windows (#14): native WinHTTP transport from the SDK (11.0.0-alpha.8+),
  # no libcurl. A required job like the others.
  windows:
    name: dub test (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0
      - name: dub test
        run: dub test
      - name: dub build -b release
        run: dub build -b release
      - name: d8ctl --help
        run: ./d8ctl.exe --help
      - name: PowerShell completion answers a real Tab
        shell: pwsh
        run: |
          $env:PATH = "$PWD;$env:PATH"
          d8ctl completion powershell | Out-String | Invoke-Expression
          $line = 'd8ctl cluster get topo'
          $got = (TabExpansion2 -inputScript $line -cursorColumn $line.Length).CompletionMatches.CompletionText
          Write-Output "got: $got"
          if ($got -notcontains 'topology') { throw "expected 'topology'" }
          $line = 'd8ctl cluster topology '
          $got = (TabExpansion2 -inputScript $line -cursorColumn $line.Length).CompletionMatches.CompletionText
          Write-Output "got: $got"
          if ($got -notcontains 'get') { throw "expected 'get' after an empty word" }
      - name: HTTP through WinHTTP (connection refused is a pass; a crash is not)
        run: |
          test -x ./d8ctl.exe || { echo "d8ctl.exe missing; build must have failed"; exit 1; }
          # Isolate every profile-directory override so a developer/CI c8ctl
          # profile can't override CAMUNDA_REST_ADDRESS and turn the probe
          # into a real call: configDir()/platformDir() read APPDATA and fall
          # back to USERPROFILE (Windows home), never HOME. Blank the c8ctl
          # env path too: CAMUNDA_BASE_URL feeds resolveConnection when no
          # profile exists, and the SDK reads CAMUNDA_* (e.g. the OAuth token
          # cache) beyond the address.
          iso="$PWD/.probe-home"
          mkdir -p "$iso"
          out=
          out=$(env -u CAMUNDA_BASE_URL -u CAMUNDA_CLIENT_ID -u CAMUNDA_CLIENT_SECRET \
            -u CAMUNDA_USERNAME -u CAMUNDA_PASSWORD -u CAMUNDA_OAUTH_URL \
            -u CAMUNDA_TOKEN_AUDIENCE -u CAMUNDA_OAUTH_SCOPE \
            HOME="$iso" APPDATA="$iso" USERPROFILE="$iso" \
            CAMUNDA_REST_ADDRESS=http://127.0.0.1:9 ./d8ctl.exe cluster topology get 2>&1) || status=$?
          status=${status:-0}
          rm -rf "$iso"
          echo "$out"
          echo "exit=$status"
          if [ $status -eq 0 ]; then
            echo "expected a connection-refused failure against 127.0.0.1:9, got success"
            exit 1
          fi
          echo "$out" | grep -qiE 'refused|connect|unreachable|timed? ?out|network' \
            || { echo "unexpected failure mode (crash?) — exit=$status"; exit 1; }
          echo "probe passed: connection refused, no crash"

  lint:
    name: D-Scanner
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0
      - run: dub run -q "safer-d:check@~>2.0" -- --format github
      - run: dub run -q dscanner@0.16.0-beta.5 -- --styleCheck --config dscanner.ini source
