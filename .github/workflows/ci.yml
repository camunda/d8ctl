name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: dub test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v5
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev zlib1g-dev
      - run: dub run -q --single scripts/generate.d
      - name: Fail if the catalog drifted
        run: git diff --exit-code -- source/d8ctl/generated
      - run: dub test
      - run: dub build -b release
      - run: ./d8ctl --help
      - run: ./d8ctl cluster topology get --help

  # Windows probe (#14): allowed to fail until Windows is supported. Every
  # step runs even after one fails, so one run shows everything that breaks.
  windows:
    name: dub test (windows-latest, probe)
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0
      - name: dub test
        continue-on-error: true
        run: dub test
      - name: dub build -b release
        continue-on-error: true
        run: dub build -b release
      - name: d8ctl --help
        continue-on-error: true
        run: ./d8ctl.exe --help
      - name: HTTP through the runtime (connection refused is a pass; a crash is not)
        continue-on-error: true
        run: |
          set +e
          CAMUNDA_REST_ADDRESS=http://127.0.0.1:9 ./d8ctl.exe cluster topology get
          echo "exit=$?"
      - name: Where is libcurl?
        continue-on-error: true
        run: |
          ls "$(dirname "$(which ldc2)")" | grep -i curl || echo "no curl next to ldc2"
          where curl.exe libcurl.dll libcurl-x64.dll 2>/dev/null || true

  lint:
    name: D-Scanner
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0
      - run: ./scripts/check-safe.sh
      - run: dub run -q dscanner@0.16.0-beta.5 -- --styleCheck --config dscanner.ini source
